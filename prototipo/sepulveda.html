/* ---------- datos: sincroniza celular/PC, con respaldo local ---------- */
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
          s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function useDatos(aviso){
  const [S,setS]=useState(null);
  const [compras,setCompras]=useState([]);
  const [sync,setSync]=useState("local");
  const db=useRef(null), timer=useRef(null);
  useEffect(()=>{
    let vivo=true;
    (async()=>{
      let d=null; try{ d=await window.claude.use("db"); }catch(e){ d=null; }
      if(!vivo)return; db.current=d;
      if(d){
        setSync("nube");
        d.doc("app/config").onSnapshot(s=>{
          if(!s.exists){const n=structuredClone(SEED);d.doc("app/config").set(n).catch(()=>{});setS(n);}
          else setS({...structuredClone(SEED),...s.data()});
        },e=>{setSync("local");aviso("Sin sincronización: "+e.code);});
        d.collection("compras").onSnapshot(s=>setCompras(
          s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.fecha<b.fecha?1:-1)),()=>{});
      }else{
        setS({...structuredClone(SEED),...LS.g("ff2-cfg",{})});
        setCompras(LS.g("ff2-compras",[]));
      }
    })();
    return()=>{vivo=false};
  },[]);
  const guardar=useCallback(fn=>{
    setS(prev=>{
      const n=fn(structuredClone(prev));
      clearTimeout(timer.current);
      timer.current=setTimeout(()=>{
        if(db.current) db.current.doc("app/config").set(n).catch(e=>aviso("No se guardó: "+e.code));
        else LS.s("ff2-cfg",n);
      },300);
      return n;
    });
  },[]);
  const guardarCompra=useCallback(c=>{
    setCompras(prev=>{
      const n=[...prev.filter(x=>x.id!==c.id),c].sort((a,b)=>a.fecha<b.fecha?1:-1);
      if(!db.current) LS.s("ff2-compras",n); return n;});
    if(db.current) db.current.doc("compras/"+c.id).set(c).catch(e=>aviso("No se guardó: "+e.code));
  },[]);
  const borrarCompra=useCallback(id=>{
    setCompras(prev=>{const n=prev.filter(x=>x.id!==id);if(!db.current)LS.s("ff2-compras",n);return n;});
    if(db.current) db.current.doc("compras/"+id).delete().catch(()=>{});
  },[]);
  return {S,compras,sync,guardar,guardarCompra,borrarCompra};
}

/* ---------- cálculos ---------- */
function useCalculos(S,compras,offW){
  return useMemo(()=>{
    if(!S)return null;
    const prod=id=>S.catalogo.find(p=>p.id===id);
    const rec=id=>S.recetas.find(r=>r.id===id);
    const hist={};
    compras.forEach(c=>(c.items||[]).forEach(i=>{
      if(!(+i.cant>0)||!(+i.valor>0))return;
      (hist[i.p]=hist[i.p]||[]).push({f:c.fecha,pu:i.valor/i.cant});}));
    Object.values(hist).forEach(h=>h.sort((a,b)=>a.f<b.f?-1:1));
    const precio=id=>hist[id]?.length?hist[id][hist[id].length-1].pu:null;
    const ultima=id=>hist[id]?.length?hist[id][hist[id].length-1].f:null;
    const varia=id=>{const h=hist[id]||[];if(h.length<2)return 0;const a=h[h.length-2].pu,b=h[h.length-1].pu;return a?(b-a)/a:0;};

    const sk=iso(sabado(offW)), aj=S.ajustes?.[sk]||{}, need={};
    const add=(pid,c)=>{const p=prod(pid);if(!p)return;(need[pid]=need[pid]||{p,cant:0}).cant+=c;};
    semanaDias(offW).forEach(d=>{const m=S.menu[iso(d)]||{};
      COMIDAS.forEach(([k])=>(m[k]||[]).forEach(rid=>{const r=rec(rid);if(r)r.ing.forEach(i=>add(i.p,i.c));}));});
    const deMenu=new Set(Object.keys(need));
    S.catalogo.forEach(p=>{
      if(need[p.id])return;
      if(p.freq==="sem")add(p.id,p.base);
      else if(p.freq==="mes"){const u=ultima(p.id);if(!u||diasEntre(u,sk)>=26)add(p.id,p.base);}});
    (S.extras?.[sk]||[]).forEach(e=>add(e.p,e.c));
    const lista=Object.values(need).map(x=>({...x,cant:aj[x.p.id]??x.cant,menu:deMenu.has(x.p.id),
        mensual:x.p.freq==="mes"&&!deMenu.has(x.p.id),precio:precio(x.p.id),varia:varia(x.p.id)}))
      .sort((a,b)=>CAT.indexOf(a.p.cat)-CAT.indexOf(b.p.cat)||a.p.n.localeCompare(b.p.n));
    const sum=arr=>arr.reduce((s,i)=>s+(i.precio!=null?i.cant*i.precio:0),0);
    const listaTotal=sum(lista), costoMenu=sum(lista.filter(i=>i.menu));
    const sinPrecio=lista.filter(i=>i.precio==null).length;

    const porMes={};compras.forEach(c=>porMes[c.fecha.slice(0,7)]=(porMes[c.fecha.slice(0,7)]||0)+totalCompra(c));
    const meses=Object.keys(porMes).sort();
    const mesAct=hoy().slice(0,7), cerrados=meses.filter(m=>m<mesAct);
    const y=cerrados.map(m=>porMes[m]);
    let pred=null, tendencia=0, banda=0;
    if(y.length>=2){
      const n=y.length, sx=(n-1)*n/2, sxx=y.reduce((s,_,i)=>s+i*i,0), sy=y.reduce((a,b)=>a+b,0);
      const sxy=y.reduce((s,v,i)=>s+i*v,0);
      const b=(n*sxy-sx*sy)/(n*sxx-sx*sx||1), a=(sy-b*sx)/n;
      pred=Math.max(0,a+b*n); tendencia=sy/n?b/(sy/n):0;
      const res=y.map((v,i)=>v-(a+b*i));
      banda=Math.sqrt(res.reduce((s,r)=>s+r*r,0)/n)||pred*.1;
    }else if(y.length===1){pred=y[0];banda=y[0]*.15;}
    const d=new Date(),diaMes=d.getDate(),diasMes=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    const gastadoMes=porMes[mesAct]||0;
    const proyMes=diaMes>=4?gastadoMes/diaMes*diasMes:(pred??gastadoMes);
    if(pred===null&&compras.length){const sem=compras.filter(c=>c.fecha>=iso(new Date(Date.now()-56*864e5)));
      pred=sem.reduce((s,c)=>s+totalCompra(c),0)/8*4.33;banda=pred*.2;}

    const d90=iso(new Date(Date.now()-90*864e5)), rec90=compras.filter(c=>c.fecha>=d90);
    const porCat={},porProd={};
    rec90.forEach(c=>(c.items||[]).forEach(i=>{const p=prod(i.p);if(!p)return;
      porCat[p.cat]=(porCat[p.cat]||0)+(+i.valor||0);porProd[p.id]=(porProd[p.id]||0)+(+i.valor||0);}));
    const perros=rec90.reduce((s,c)=>s+(c.items||[]).filter(i=>prod(i.p)?.cat==="Perros").reduce((a,i)=>a+(+i.valor||0),0),0);
    const conDetalle=rec90.filter(c=>c.items?.length).length;
    const infl=Object.keys(hist).filter(k=>hist[k].length>=2)
      .map(k=>{const h=hist[k];return (h[h.length-1].pu-h[0].pu)/h[0].pu;});
    const inflacion=infl.length?infl.reduce((a,b)=>a+b,0)/infl.length:0;
    const alertas=S.catalogo.map(p=>({p,v:varia(p.id),pu:precio(p.id)})).filter(x=>Math.abs(x.v)>=.08).sort((a,b)=>b.v-a.v);
    const promSem=compras.filter(c=>c.fecha>=iso(new Date(Date.now()-56*864e5))).reduce((s,c)=>s+totalCompra(c),0)/8;

    return {prod,rec,precio,ultima,varia,hist,lista,listaTotal,costoMenu,sinPrecio,sk,
      porMes,meses,mesAct,gastadoMes,proyMes,pred,banda,tendencia,promSem,
      porCat,porProd,perros,conDetalle,inflacion,alertas};
  },[S,compras,offW]);
}

const ALIAS={pechuga:"pollo",muslo:"pollo",pierna:"pollo",pernil:"pollo",gallina:"pollo",
 res:"carne",bistec:"carne",sobrebarriga:"carne",costilla:"carne",molida:"molida",
 huevo:"huevos",cubeta:"huevos",leche:"leche",queso:"queso",yogurt:"yogur",
 cebolla:"cebollac",junca:"cebollal",larga:"cebollal",tomate:"tomate",papa:"papa",
 platano:"platano",maduro:"platano",banano:"banano",arroz:"arroz",aceite:"aceite",
 panela:"panela",azucar:"azucar",lenteja:"lentejas",frijol:"frijoles",arveja:"arveja",
 arepa:"arepas",pan:"pan",atun:"atun",papel:"papelh",higienico:"papelh",
 detergente:"detergente",jabon:"jabonloza",concentrado:"concentrado",dogchow:"concentrado",
 zanahoria:"zanahoria",lechuga:"lechuga",limon:"limon",naranja:"naranja",mango:"mango",
 papaya:"papaya",pina:"pina",yuca:"yuca",cerdo:"cerdo",salchicha:"salchicha",pasta:"pasta",
 espagueti:"pasta",cafe:"cafe",chocolate:"chocolate",harina:"harina",sal:"sal",ajo:"ajo",
 pimenton:"pimenton",cilantro:"cilantro",aguacate:"aguacate",refresco:"refresco",fruti:"refresco"};
function emparejar(desc,catalogo){
  const d=norm(desc);
  for(const p of catalogo){const w=norm(p.n).split(" ")[0];if(w.length>=5&&d.includes(w))return p.id;}
  for(const k in ALIAS){if(d.includes(k)&&catalogo.some(p=>p.id===ALIAS[k]))return ALIAS[k];}
  return "";
}
function lineasDeTexto(texto,catalogo){
  const out=[];
  texto.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(l.length<6||/^(total|subtotal|iva|cambio|efectivo|nit|factura|cliente|direccion|cajero|fecha|resolucion|gracias)/i.test(norm(l)))return;
    const nums=l.match(/\d[\d.,]*/g)||[];
    if(!nums.length)return;
    const valor=parseMoneyCO(nums[nums.length-1]);
    if(valor<300)return;
    let cant=1;
    if(nums.length>=2){const c=parseFloat(nums[0].replace(/\./g,"").replace(",","."));if(c>0&&c<200)cant=c;}
    const desc=l.slice(0,l.search(/\d[\d.,]*\s*$/)>0?l.search(/\d[\d.,]*\s*$/):l.length)
      .replace(/[\d.,]+\s*$/,"").replace(/\s{2,}/g," ").trim();
    if(desc.length<3)return;
    out.push({desc,cant,valor,p:emparejar(desc,catalogo)});
  });
  return out;
}
function leerXmlDian(texto,catalogo){
  let doc=new DOMParser().parseFromString(texto,"application/xml");
  const cdata=doc.getElementsByTagName("cbc:Description")[0];
  if(doc.documentElement.nodeName.includes("AttachedDocument")&&cdata&&/<Invoice/i.test(cdata.textContent))
    doc=new DOMParser().parseFromString(cdata.textContent,"application/xml");
  const g=(el,t)=>el?.getElementsByTagName(t)[0]?.textContent?.trim()||"";
  const filas=[...doc.getElementsByTagName("cac:InvoiceLine")].map(l=>{
    const desc=g(l.getElementsByTagName("cac:Item")[0],"cbc:Description")||g(l,"cbc:Description");
    return {desc,cant:parseFloat(g(l,"cbc:InvoicedQuantity"))||1,
            valor:parseFloat(g(l,"cbc:LineExtensionAmount"))||0,p:emparejar(desc,catalogo)};
  }).filter(f=>f.valor>0);
  return {filas,fecha:g(doc.documentElement,"cbc:IssueDate")||"",
    tienda:g(doc.getElementsByTagName("cac:AccountingSupplierParty")[0],"cbc:RegistrationName")||"",
    total:parseFloat(g(doc.getElementsByTagName("cac:LegalMonetaryTotal")[0],"cbc:PayableAmount"))||0};
}
async function textoDePdf(file){
  const buf=await file.arrayBuffer();
  if(window.pdfjsLib&&pdfjsLib.GlobalWorkerOptions)
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let txt="";
  for(let i=1;i<=pdf.numPages;i++){
    const c=await (await pdf.getPage(i)).getTextContent();
    const filas={};
    c.items.forEach(it=>{const y=Math.round(it.transform[5]);(filas[y]=filas[y]||[]).push(it.str);});
    txt+=Object.keys(filas).sort((a,b)=>b-a).map(y=>filas[y].join(" ")).join("\n")+"\n";
  }
  return txt;
}

/* ---------- gráfico de meses y pronóstico ---------- */
function GraficoMeses({K}){
  const reales=K.meses.slice(-6).map(m=>({k:m,v:K.porMes[m],t:m===K.mesAct?"parcial":"real"}));
  const datos=[...reales];
  if(K.pred!=null){
    const d=new Date(K.mesAct+"-15T12:00");d.setMonth(d.getMonth()+1);
    datos.push({k:iso(d).slice(0,7),v:K.pred,t:"pred"});
  }
  if(!datos.length)return <Empty>Registra compras y aquí verás la historia y el pronóstico.</Empty>;
  const W=340,H=150,pad=26,base=H-24,top=16;
  const mx=Math.max(...datos.map(d=>Math.max(d.v,d.t==="parcial"?K.proyMes:0)),1);
  const bw=(W-pad*2)/datos.length, w=Math.min(34,bw*.6);
  const y=v=>base-(v/mx)*(base-top);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Gasto por mes y pronóstico">
      <line x1={pad-8} y1={base} x2={W-pad+8} y2={base} stroke="var(--line)" strokeWidth="1"/>
      {datos.map((d,i)=>{
        const cx=pad+bw*i+bw/2, x=cx-w/2;
        const proy=d.t==="parcial"?K.proyMes:null;
        return (<g key={d.k}>
          {proy&&proy>d.v&&<rect x={x} y={y(proy)} width={w} height={Math.max(0,y(d.v)-y(proy))}
            fill="none" stroke="var(--gold)" strokeWidth="1.2" strokeDasharray="3 2" rx="2"/>}
          <rect x={x} y={y(d.v)} width={w} height={Math.max(1.5,base-y(d.v))} rx="2"
            fill={d.t==="pred"?"none":"var(--brand)"} opacity={d.t==="parcial"?.55:1}
            stroke={d.t==="pred"?"var(--gold)":"none"} strokeWidth="1.4" strokeDasharray={d.t==="pred"?"4 3":undefined}/>
          <text x={cx} y={y(proy&&proy>d.v?proy:d.v)-5} textAnchor="middle" fontSize="9.5"
            className="mono" fill={d.t==="pred"?"var(--gold)":"var(--muted)"}>{kmoney(proy&&proy>d.v?proy:d.v)}</text>
          <text x={cx} y={base+13} textAnchor="middle" fontSize="9" fill="var(--muted)">{mesNom(d.k)}</text>
        </g>);})}
    </svg>);
}
function Barras({filas,tone="brand"}){
  if(!filas.length)return null;
  const mx=Math.max(...filas.map(f=>f[1]));
  return (<div className="flex flex-col gap-2">
    {filas.map(([n,v])=>(
      <div key={n} className="grid grid-cols-[minmax(72px,26%)_1fr_auto] items-center gap-2.5 text-sm">
        <span className="text-muted text-xs truncate">{n}</span>
        <span className="h-3.5 rounded-sm" style={{width:Math.max(2,v/mx*100)+"%",background:tone==="gold"?"var(--gold)":"var(--brand)"}}/>
        <span className="mono text-xs">{money(v)}</span>
      </div>))}
  </div>);
}

/* ---------- FACTURAS ---------- */
const TIPOS=[["supermercado","Supermercado"],["aparte","Compras aparte"],["aseo","Aseo"],
             ["perros","Perros"],["medicamentos","Medicamentos"],["otros","Otros"]];
function Facturas(){
  const {S,K,compras,guardarCompra,aviso,abrir}=useApp();
  const [cargando,setCargando]=useState("");
  const [borrador,setBorrador]=useState(null);
  const fileRef=useRef(null);

  async function procesar(file){
    setCargando("Leyendo "+file.name+"…");
    try{
      const ext=file.name.split(".").pop().toLowerCase();
      let base={fecha:iso(sabado(0)),tienda:"",total:0,filas:[]};
      if(ext==="xml"){
        const r=leerXmlDian(await file.text(),S.catalogo);
        base={fecha:(r.fecha||base.fecha).slice(0,10),tienda:r.tienda,total:r.total,filas:r.filas};
        if(!r.filas.length)throw new Error("El XML no trae líneas de factura reconocibles.");
      }else if(ext==="pdf"){
        const txt=await textoDePdf(file);
        if(txt.trim().length<40)throw new Error("Ese PDF no tiene texto (parece escaneado). Agrega los ítems a mano.");
        base.filas=lineasDeTexto(txt,S.catalogo);
        const m=txt.match(/(\d{4}-\d{2}-\d{2})/); if(m)base.fecha=m[1];
        const t=txt.match(/total[^\d]{0,20}([\d.,]{4,})/i); if(t)base.total=parseMoneyCO(t[1]);
      }else{
        base.filas=lineasDeTexto(await file.text(),S.catalogo);
      }
      setBorrador({...base,tipo:"supermercado",archivo:file.name});
      if(!base.filas.length)aviso("No se reconocieron líneas: revisa y agrégalas a mano.");
    }catch(e){ aviso(e.message||"No se pudo leer el archivo"); }
    setCargando("");
  }
  function guardar(){
    const items=borrador.filas.filter(f=>f.p&&+f.valor>0).map(f=>({p:f.p,cant:+f.cant||1,valor:+f.valor}));
    const c={id:uid("c"),fecha:borrador.fecha,tienda:borrador.tienda||"Mercado",tipo:borrador.tipo,
      total:+borrador.total||items.reduce((s,i)=>s+i.valor,0),items,origen:borrador.archivo||"manual"};
    if(!c.total&&!items.length)return aviso("Falta el total o al menos un ítem.");
    guardarCompra(c);setBorrador(null);aviso("Compra guardada");
  }
  const setFila=(ix,campo,v)=>setBorrador(b=>({...b,filas:b.filas.map((f,i)=>i===ix?{...f,[campo]:v}:f)}));

  return (<div className="flex flex-col gap-4 fade">
    <div className="flex flex-wrap items-end justify-between gap-3">
      <div><h2 className="serif text-2xl">Facturas</h2>
        <p className="text-sm text-muted">Sube el XML de la factura electrónica (el más exacto), el PDF, o registra solo el total.</p></div>
      <Btn variant="ghost" icon="plus" onClick={()=>setBorrador({fecha:iso(sabado(0)),tienda:"",total:0,tipo:"supermercado",filas:[]})}>Manual</Btn>
    </div>

    {!borrador&&(
      <Card className="p-6 border-dashed text-center flex flex-col items-center gap-3"
        onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)procesar(f);}}>
        <Icon n="upload" size={30} className="text-brand"/>
        <div><b className="text-base">Arrastra la factura aquí</b>
          <p className="text-sm text-muted mt-1">XML de la DIAN, PDF con texto, o TXT. Se lee en tu dispositivo, no se envía a ningún lado.</p></div>
        <input ref={fileRef} type="file" accept=".xml,.pdf,.txt" className="hidden"
          onChange={e=>{const f=e.target.files[0];if(f)procesar(f);e.target.value="";}}/>
        <Btn variant="primary" icon="file" onClick={()=>fileRef.current.click()}>Escoger archivo</Btn>
        {cargando&&<span className="text-sm text-muted">{cargando}</span>}
      </Card>)}

    {borrador&&(
      <Card className="p-4 flex flex-col gap-4">
        <div className="grid gap-3 sm:grid-cols-4">
          <Field label="Fecha"><input type="date" className={inputCls} value={borrador.fecha}
            onChange={e=>setBorrador({...borrador,fecha:e.target.value})}/></Field>
          <Field label="Dónde"><input className={inputCls} value={borrador.tienda} placeholder="Éxito, D1, droguería…"
            onChange={e=>setBorrador({...borrador,tienda:e.target.value})}/></Field>
          <Field label="Tipo"><select className={inputCls} value={borrador.tipo}
            onChange={e=>setBorrador({...borrador,tipo:e.target.value})}>
            {TIPOS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></Field>
          <Field label="Total pagado"><input type="number" className={inputCls+" mono"} value={borrador.total||""}
            onChange={e=>setBorrador({...borrador,total:+e.target.value})}/></Field>
        </div>
        <div>
          <div className="flex items-center justify-between mb-2">
            <Label>Ítems detectados ({borrador.filas.length})</Label>
            <Btn variant="bare" icon="plus" onClick={()=>setBorrador(b=>({...b,filas:[...b.filas,{desc:"",cant:1,valor:0,p:""}]}))}>Agregar</Btn>
          </div>
          <div className="overflow-x-auto -mx-1 px-1">
            <table className="w-full text-sm border-separate border-spacing-y-1 min-w-[560px]">
              <thead><tr className="text-left">
                <th className="font-semibold text-xs text-muted pb-1">En la factura</th>
                <th className="font-semibold text-xs text-muted pb-1 w-44">Producto</th>
                <th className="font-semibold text-xs text-muted pb-1 w-20">Cant.</th>
                <th className="font-semibold text-xs text-muted pb-1 w-28">Valor</th>
                <th></th></tr></thead>
              <tbody>{borrador.filas.map((f,ix)=>(
                <tr key={ix} className={f.p?"":"opacity-60"}>
                  <td className="pr-2"><input className={inputCls+" py-1.5"} value={f.desc} onChange={e=>setFila(ix,"desc",e.target.value)}/></td>
                  <td className="pr-2"><select className={inputCls+" py-1.5"} value={f.p} onChange={e=>setFila(ix,"p",e.target.value)}>
                    <option value="">— ignorar —</option>
                    {CAT.map(c=>(<optgroup key={c} label={c}>
                      {S.catalogo.filter(p=>p.cat===c).map(p=><option key={p.id} value={p.id}>{p.n}</option>)}</optgroup>))}
                  </select></td>
                  <td className="pr-2"><input type="number" step="0.25" className={inputCls+" py-1.5 mono"} value={f.cant}
                    onChange={e=>setFila(ix,"cant",+e.target.value)}/></td>
                  <td className="pr-2"><input type="number" className={inputCls+" py-1.5 mono"} value={f.valor}
                    onChange={e=>setFila(ix,"valor",+e.target.value)}/></td>
                  <td><button className="text-muted hover:text-bad p-1" aria-label="Quitar"
                    onClick={()=>setBorrador(b=>({...b,filas:b.filas.filter((_,i)=>i!==ix)}))}><Icon n="x" size={15}/></button></td>
                </tr>))}</tbody>
            </table>
          </div>
          {!borrador.filas.length&&<Empty>Sin detalle. Puedes guardar solo con el total.</Empty>}
        </div>
        <div className="flex justify-end gap-2">
          <Btn onClick={()=>setBorrador(null)}>Cancelar</Btn>
          <Btn variant="primary" icon="check" onClick={guardar}>Guardar compra</Btn>
        </div>
      </Card>)}

    <Card className="divide-y divide-line">
      {compras.length?compras.map(c=>(
        <div key={c.id} className="flex items-center gap-3 px-4 py-3">
          <Icon n={c.items?.length?"file":"wallet"} className="text-muted shrink-0"/>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2 flex-wrap text-sm font-semibold">{c.tienda||"Mercado"}
              <Chip tone={c.tipo==="perros"?"brand":"n"}>{TIPOS.find(t=>t[0]===c.tipo)?.[1]||"Supermercado"}</Chip>
              {c.items?.length?<Chip>{c.items.length} ítems</Chip>:<Chip tone="gold">solo total</Chip>}</div>
            <div className="mono text-[11px] text-muted">{fechaCorta(c.fecha)}{c.origen&&c.origen!=="manual"?" · "+c.origen:""}</div>
          </div>
          <span className="mono text-sm">{money(totalCompra(c))}</span>
          <button className="text-muted hover:text-ink p-1" onClick={()=>abrir({t:"ver-compra",id:c.id})} aria-label="Abrir"><Icon n="edit" size={16}/></button>
        </div>)):<Empty>Aún no hay facturas. Empieza por los sábados de los últimos meses con el extracto del banco: fecha y total bastan.</Empty>}
    </Card>
  </div>);
}

/* ---------- GASTOS ---------- */
function Gastos(){
  const {K,compras,abrir}=useApp();
  const porTipo={};compras.filter(c=>c.fecha>=iso(new Date(Date.now()-90*864e5)))
    .forEach(c=>{const t=TIPOS.find(x=>x[0]===(c.tipo||"supermercado"))[1];porTipo[t]=(porTipo[t]||0)+totalCompra(c);});
  const cats=Object.entries(K.porCat).sort((a,b)=>b[1]-a[1]);
  const top=Object.entries(K.porProd).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,v])=>[K.prod(id)?.n||id,v]);
  return (<div className="flex flex-col gap-4 fade">
    <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">
      <Tile label="Este mes" value={money(K.gastadoMes)} sub={"proyectado "+money(K.proyMes)}/>
      <Tile label="Próximo mes" tone="gold" value={K.pred!=null?money(K.pred):"—"} sub="pronóstico"/>
      <Tile label="Semanal" value={money(K.promSem)} sub="promedio 8 semanas"/>
      <Tile label="Perros" value={money(K.perros)} sub="últimos 90 días"/>
    </div>
    <Card className="p-4"><h3 className="serif text-xl mb-1">Historia y pronóstico</h3><GraficoMeses K={K}/></Card>
    <div className="grid gap-4 md:grid-cols-2">
      <Card className="p-4">
        <h3 className="serif text-xl mb-3">Por tipo de compra <span className="text-xs text-muted font-sans">90 días</span></h3>
        {Object.keys(porTipo).length?<Barras filas={Object.entries(porTipo).sort((a,b)=>b[1]-a[1])}/>
          :<Empty>Sin compras en los últimos 90 días.</Empty>}
      </Card>
      <Card className="p-4">
        <h3 className="serif text-xl mb-3">Por categoría <span className="text-xs text-muted font-sans">90 días</span></h3>
        {cats.length?<><Barras filas={cats} tone="gold"/>
          <p className="text-xs text-muted mt-3">Sale de {K.conDetalle} compras con detalle por producto.</p></>
          :<Empty>Necesita al menos una factura con ítems.</Empty>}
      </Card>
    </div>
    {top.length>0&&<Card className="p-4"><h3 className="serif text-xl mb-3">Los 10 que más pesan</h3><Barras filas={top}/></Card>}
    {K.alertas.length>0&&(
      <Card className="p-4"><h3 className="serif text-xl mb-3">Cambios de precio</h3>
        <ul className="divide-y divide-line">{K.alertas.map(a=>(
          <li key={a.p.id} className="flex items-center gap-3 py-2">
            <span className="flex-1 text-sm">{a.p.n}</span>
            <span className="mono text-xs text-muted">{money(a.pu)}/{a.p.un}</span>
            <Chip tone={a.v>0?"up":"down"}><Icon n={a.v>0?"up":"down"} size={12}/>{Math.abs(Math.round(a.v*100))}%</Chip>
          </li>))}</ul></Card>)}
  </div>);
}

/* ---------- modales ---------- */
function Modales(){
  const {S,K,modal,cerrar,abrir,guardar,guardarCompra,borrarCompra,compras,aviso,offW}=useApp();
  const [tmp,setTmp]=useState(null);
  useEffect(()=>{setTmp(null)},[modal]);
  if(!modal)return null;
  const M=modal;

  if(M.t==="comida"){
    const sel=new Set(tmp??((S.menu[M.fecha]||{})[M.comida]||[]));
    const rs=[...S.recetas].sort((a,b)=>(a.tipo===M.comida?0:1)-(b.tipo===M.comida?0:1)||a.n.localeCompare(b.n));
    return <Modal title={DIAS[new Date(M.fecha+"T12:00").getDay()]+" · "+COMIDAS.find(c=>c[0]===M.comida)[1]} onClose={cerrar}
      footer={<><Btn onClick={cerrar}>Cancelar</Btn><Btn variant="primary" onClick={()=>{
        guardar(n=>{n.menu[M.fecha]=n.menu[M.fecha]||{};n.menu[M.fecha][M.comida]=[...sel];return n;});cerrar();}}>Listo</Btn></>}>
      <div className="flex flex-wrap gap-1.5">{rs.map(r=>(
        <button key={r.id} onClick={()=>{const s=new Set(sel);s.has(r.id)?s.delete(r.id):s.add(r.id);setTmp([...s]);}}
          className={"px-3 py-1.5 rounded-full text-sm border "+(sel.has(r.id)?"bg-brand text-onbrand border-brand font-semibold":"border-line text-muted hover:text-ink")}>
          {r.n}</button>))}</div>
    </Modal>;
  }
  if(M.t==="cant"){
    const v=tmp??M.cant;
    return <Modal title={"Cantidad · "+K.prod(M.pid).n} onClose={cerrar}
      footer={<><Btn onClick={cerrar}>Cancelar</Btn><Btn variant="primary" onClick={()=>{
        guardar(n=>{n.ajustes=n.ajustes||{};(n.ajustes[K.sk]=n.ajustes[K.sk]||{})[M.pid]=+v||0;return n;});cerrar();}}>Guardar</Btn></>}>
      <Field label={"Cantidad en "+K.prod(M.pid).un}>
        <input type="number" step="0.25" min="0" autoFocus className={inputCls+" mono"} value={v} onChange={e=>setTmp(e.target.value)}/></Field>
    </Modal>;
  }
  if(M.t==="extra"){
    const v=tmp||{p:"",c:1,q:""};
    const nq=norm(v.q);
    const opts=S.catalogo.filter(p=>!nq||norm(p.n).includes(nq));
    return <Modal wide title="Agregar a la lista" onClose={cerrar}
      footer={<><Btn onClick={cerrar}>Cancelar</Btn>
        <Btn variant="primary" disabled={!v.p} onClick={()=>{
          guardar(n=>{n.extras=n.extras||{};(n.extras[K.sk]=n.extras[K.sk]||[]).push({p:v.p,c:+v.c||1});return n;});cerrar();}}>
          Agregar{v.p?" "+K.prod(v.p).n:""}</Btn></>}>
      <div className="relative">
        <Icon n="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted"/>
        <input autoFocus value={v.q} onChange={e=>setTmp({...v,q:e.target.value})}
          placeholder="Buscar producto" className={inputCls+" pl-9"}/>
      </div>
      <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-[42vh] overflow-auto -mx-1 px-1">
        {opts.map(p=>(
          <button key={p.id} onClick={()=>setTmp({...v,p:p.id})}
            className={"flex flex-col items-center gap-1.5 p-2.5 rounded-xl2 border text-center "+
              (v.p===p.id?"border-brand bg-brandsoft":"border-line hover:bg-sunk")}>
            <Glifo cat={p.cat} size={38}/>
            <span className="text-xs leading-tight">{p.n}</span>
          </button>))}
        {!opts.length&&<p className="col-span-full text-sm text-muted text-center py-4">Nada con ese nombre. Créalo en Recetas → Productos.</p>}
      </div>
      <Field label={"Cantidad"+(v.p?" en "+K.prod(v.p).un:"")}>
        <input type="number" step="0.25" className={inputCls+" mono"} value={v.c} onChange={e=>setTmp({...v,c:e.target.value})}/></Field>
    </Modal>;
  }
  if(M.t==="ver-receta"){
    const r=K.rec(M.id); if(!r)return null;
    const costo=r.ing.reduce((s,i)=>s+(K.precio(i.p)??0)*i.c,0);
    const dest=tmp||{fecha:hoy(),comida:r.tipo};
    return <Modal wide title={r.n} onClose={cerrar}
      footer={<><Btn icon="edit" onClick={()=>abrir({t:"receta",id:r.id})}>Editar</Btn>
        <Btn variant="primary" icon="calendar" onClick={()=>{
          guardar(n=>{n.menu[dest.fecha]=n.menu[dest.fecha]||{};
            const a=new Set(n.menu[dest.fecha][dest.comida]||[]);a.add(r.id);
            n.menu[dest.fecha][dest.comida]=[...a];return n;});
          aviso("Agregada al menú");cerrar();}}>Agregar al menú</Btn></>}>
      <div className="flex flex-wrap gap-1.5">
        <Chip tone="brand">{COMIDAS.find(c=>c[0]===r.tipo)[1]}</Chip>
        <Chip><Icon n="clock" size={12}/>{r.t} min</Chip>
{costo>0&&<Chip tone="gold">{money(costo)} · {money(costo/4)} por persona</Chip>}
        {r.tags.map(t=><Chip key={t} tone={TAGCOL[t]||"n"}>{t}</Chip>)}
      </div>
      {r.nota&&<p className="text-sm text-muted italic border-l-2 border-gold pl-3">{r.nota}</p>}
      <div><Label>Ingredientes para 4</Label>
        <ul className="mt-1.5 divide-y divide-line">{r.ing.map((i,ix)=>(
          <li key={ix} className="flex items-center gap-2.5 py-1.5 text-sm">
            <Glifo cat={K.prod(i.p)?.cat||"Otros"} size={28}/>
            <span className="flex-1">{K.prod(i.p)?.n||"?"}</span>
            <span className="mono text-muted">{fmt(i.c)} {K.prod(i.p)?.un}{K.precio(i.p)!=null?" · "+money(i.c*K.precio(i.p)):""}</span></li>))}</ul></div>
      <div><Label>Preparación</Label>
        <ol className="mt-1.5 flex flex-col gap-2">{r.pasos.map((p,ix)=>(
          <li key={ix} className="flex gap-3 text-sm">
            <span className="mono text-brand font-semibold shrink-0">{ix+1}</span><span>{p}</span></li>))}</ol></div>
      <div className="flex flex-wrap gap-2 pt-1">
        <a href={yt(r.n)} target="_blank" rel="noopener" className="inline-flex items-center gap-2 text-sm font-semibold text-brand hover:underline">
          <Icon n="link" size={15}/>Ver preparación en video</a>
        <a href={gg(r.n)} target="_blank" rel="noopener" className="inline-flex items-center gap-2 text-sm font-semibold text-muted hover:text-ink hover:underline">
          <Icon n="search" size={15}/>Buscar variaciones</a>
      </div>
      <div className="border-t border-line pt-3 grid grid-cols-2 gap-3">
        <Field label="Programar el día"><input type="date" className={inputCls} value={dest.fecha}
          onChange={e=>setTmp({...dest,fecha:e.target.value})}/></Field>
        <Field label="Comida"><select className={inputCls} value={dest.comida} onChange={e=>setTmp({...dest,comida:e.target.value})}>
          {COMIDAS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></Field>
      </div>
    </Modal>;
  }
  if(M.t==="receta"){
    const r0=M.id?K.rec(M.id):{n:"",tipo:"almuerzo",t:30,ing:[],pasos:[""],tags:[],nota:""};
    const r=tmp||structuredClone(r0);
    const set=(k,v)=>setTmp({...r,[k]:v});
    return <Modal wide title={M.id?"Editar receta":"Nueva receta"} onClose={cerrar}
      footer={<>{M.id&&<Btn variant="bare" icon="trash" onClick={()=>{
          guardar(n=>{n.recetas=n.recetas.filter(x=>x.id!==M.id);
            Object.values(n.menu).forEach(m=>COMIDAS.forEach(([k])=>{if(m[k])m[k]=m[k].filter(x=>x!==M.id)}));return n;});cerrar();}}>Borrar</Btn>}
        <Btn onClick={cerrar}>Cancelar</Btn>
        <Btn variant="primary" onClick={()=>{
          if(!r.n.trim())return aviso("Falta el nombre");
          const limpia={...r,t:+r.t||20,ing:r.ing.filter(i=>i.p&&+i.c>0).map(i=>({p:i.p,c:+i.c})),pasos:r.pasos.filter(p=>p.trim())};
          guardar(n=>{if(M.id)n.recetas=n.recetas.map(x=>x.id===M.id?{...limpia,id:M.id}:x);
            else n.recetas.push({...limpia,id:uid("r")});return n;});cerrar();}}>Guardar</Btn></>}>
      <div className="grid gap-3 sm:grid-cols-3">
        <Field label="Nombre"><input className={inputCls} value={r.n} onChange={e=>set("n",e.target.value)}/></Field>
        <Field label="Comida"><select className={inputCls} value={r.tipo} onChange={e=>set("tipo",e.target.value)}>
          {COMIDAS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></Field>
        <Field label="Minutos"><input type="number" className={inputCls+" mono"} value={r.t} onChange={e=>set("t",e.target.value)}/></Field>
      </div>
      <div><Label>Ingredientes</Label>
        <div className="flex flex-col gap-2 mt-1.5">{r.ing.map((i,ix)=>(
          <div key={ix} className="flex gap-2">
            <select className={inputCls} value={i.p} onChange={e=>set("ing",r.ing.map((x,j)=>j===ix?{...x,p:e.target.value}:x))}>
              <option value="">—</option>
              {CAT.map(c=><optgroup key={c} label={c}>{S.catalogo.filter(p=>p.cat===c).map(p=><option key={p.id} value={p.id}>{p.n}</option>)}</optgroup>)}
            </select>
            <input type="number" step="0.25" className={inputCls+" mono w-24"} value={i.c}
              onChange={e=>set("ing",r.ing.map((x,j)=>j===ix?{...x,c:e.target.value}:x))}/>
            <button className="text-muted hover:text-bad px-1" onClick={()=>set("ing",r.ing.filter((_,j)=>j!==ix))}><Icon n="x" size={16}/></button>
          </div>))}</div>
        <Btn variant="bare" icon="plus" className="mt-1" onClick={()=>set("ing",[...r.ing,{p:S.catalogo[0].id,c:1}])}>Ingrediente</Btn></div>
      <div><Label>Preparación</Label>
        <div className="flex flex-col gap-2 mt-1.5">{r.pasos.map((p,ix)=>(
          <div key={ix} className="flex gap-2 items-start">
            <span className="mono text-brand font-semibold pt-2">{ix+1}</span>
            <textarea rows="2" className={inputCls} value={p} onChange={e=>set("pasos",r.pasos.map((x,j)=>j===ix?e.target.value:x))}/>
            <button className="text-muted hover:text-bad px-1 pt-2" onClick={()=>set("pasos",r.pasos.filter((_,j)=>j!==ix))}><Icon n="x" size={16}/></button>
          </div>))}</div>
        <Btn variant="bare" icon="plus" className="mt-1" onClick={()=>set("pasos",[...r.pasos,""])}>Paso</Btn></div>
      <Field label="Nota"><input className={inputCls} value={r.nota} onChange={e=>set("nota",e.target.value)}/></Field>
    </Modal>;
  }
  if(M.t==="productos"){
    const ed=tmp;
    if(ed) return <Modal title={ed.id?"Editar producto":"Nuevo producto"} onClose={()=>setTmp(null)}
      footer={<><Btn onClick={()=>setTmp(null)}>Volver</Btn><Btn variant="primary" onClick={()=>{
        guardar(n=>{const d={n:ed.n,cat:ed.cat,un:ed.un,freq:ed.freq,base:+ed.base||1,precio:+ed.precio||0};
          if(ed.id)n.catalogo=n.catalogo.map(p=>p.id===ed.id?{...p,...d}:p);else n.catalogo.push({id:uid("p"),...d});return n;});
        setTmp(null);}}>Guardar</Btn></>}>
      <Field label="Nombre"><input className={inputCls} value={ed.n} onChange={e=>setTmp({...ed,n:e.target.value})}/></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Categoría"><select className={inputCls} value={ed.cat} onChange={e=>setTmp({...ed,cat:e.target.value})}>
          {CAT.map(c=><option key={c}>{c}</option>)}</select></Field>
        <Field label="Unidad"><select className={inputCls} value={ed.un} onChange={e=>setTmp({...ed,un:e.target.value})}>
          {["lb","kg","g","u","l","ml","manojo","paca","bolsa","caja"].map(u=><option key={u}>{u}</option>)}</select></Field>
        <Field label="Cada cuánto"><select className={inputCls} value={ed.freq} onChange={e=>setTmp({...ed,freq:e.target.value})}>
          <option value="sem">Cada semana</option><option value="mes">Cada mes</option><option value="ocas">Ocasional</option></select></Field>
        <Field label="Cantidad típica"><input type="number" step="0.25" className={inputCls+" mono"} value={ed.base} onChange={e=>setTmp({...ed,base:e.target.value})}/></Field>
      </div>
      <p className="text-xs text-muted">El precio no se escribe a mano: sale solo del valor que registres en las facturas.</p>
    </Modal>;
    return <Modal wide title="Productos" onClose={cerrar}
      footer={<Btn variant="primary" icon="plus" onClick={()=>setTmp({n:"",cat:"Verduras",un:"lb",freq:"sem",base:1,precio:0})}>Nuevo producto</Btn>}>
      {CAT.map(c=>{const g=S.catalogo.filter(p=>p.cat===c);if(!g.length)return null;
        return <div key={c}><Label>{c}</Label>
          <ul className="divide-y divide-line mt-1 mb-2">{g.map(p=>(
            <li key={p.id} className="flex items-center gap-2 py-1.5 text-sm">
              <Glifo cat={p.cat} size={26}/>
              <span className="flex-1">{p.n} <Chip>{{sem:"semanal",mes:"mensual",ocas:"ocasional"}[p.freq]}</Chip></span>
              <span className="mono text-xs text-muted">{K.precio(p.id)!=null?money(K.precio(p.id))+"/"+p.un:"sin precio"}</span>
              <button className="text-muted hover:text-ink p-1" onClick={()=>setTmp({...p})}><Icon n="edit" size={15}/></button>
            </li>))}</ul></div>;})}
    </Modal>;
  }
  if(M.t==="ver-compra"){
    const c=compras.find(x=>x.id===M.id); if(!c)return null;
    return <Modal wide title={(c.tienda||"Mercado")+" · "+fechaCorta(c.fecha)} onClose={cerrar}
      footer={<><Btn variant="bare" icon="trash" onClick={()=>{if(confirm("¿Borrar esta compra?")){borrarCompra(c.id);cerrar();}}}>Borrar</Btn>
        <Btn variant="primary" onClick={cerrar}>Cerrar</Btn></>}>
      <div className="flex items-baseline justify-between">
        <Chip tone="brand">{TIPOS.find(t=>t[0]===(c.tipo||"supermercado"))?.[1]}</Chip>
        <span className="serif text-2xl">{money(totalCompra(c))}</span></div>
      {c.items?.length?<ul className="divide-y divide-line">{c.items.map((i,ix)=>(
        <li key={ix} className="flex justify-between py-2 text-sm"><span>{K.prod(i.p)?.n||i.p}</span>
          <span className="mono text-muted">{fmt(i.cant)} × {money(i.valor/(i.cant||1))} = {money(i.valor)}</span></li>))}</ul>
        :<Empty>Registrada solo con el total. Sube la factura para tener el detalle.</Empty>}
    </Modal>;
  }
  if(M.t==="compra-lista"){
    const hechos=new Set(S.lista?.[K.sk]||[]);
    const sel=(hechos.size?K.lista.filter(i=>hechos.has(i.p.id)):K.lista);
    const v=tmp||{fecha:iso(sabado(offW)),tienda:"Mercado",tipo:"supermercado"};
    const est=sel.reduce((s,i)=>s+i.cant*i.precio,0);
    return <Modal title="Registrar compra de la lista" onClose={cerrar}
      footer={<><Btn onClick={cerrar}>Cancelar</Btn><Btn variant="primary" icon="check" onClick={()=>{
        guardarCompra({id:uid("c"),fecha:v.fecha,tienda:v.tienda,tipo:v.tipo,origen:"lista",
          items:sel.map(i=>({p:i.p.id,cant:i.cant,valor:i.precio!=null?Math.round(i.cant*i.precio):0})),total:Math.round(est)});
        aviso("Compra creada: escribe los valores reales en Facturas");cerrar();}}>Crear</Btn></>}>
      <p className="text-sm text-muted">Se guardarán {sel.length} productos con la cantidad de la lista y el valor en cero.
        Ábrela en <b>Facturas</b> y escribe lo que pagó cada uno: así la app aprende los precios.</p>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Fecha"><input type="date" className={inputCls} value={v.fecha} onChange={e=>setTmp({...v,fecha:e.target.value})}/></Field>
        <Field label="Dónde"><input className={inputCls} value={v.tienda} onChange={e=>setTmp({...v,tienda:e.target.value})}/></Field>
      </div>
      <Field label="Tipo"><select className={inputCls} value={v.tipo} onChange={e=>setTmp({...v,tipo:e.target.value})}>
        {TIPOS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></Field>
    </Modal>;
  }
  return null;
}

/* ---------- aplicación ---------- */
const VISTAS=[["inicio","Inicio","home"],["lista","Lista","basket"],["menu","Menú","calendar"],
              ["recetas","Recetas","pot"],["facturas","Facturas","receipt"],["gastos","Gastos","chart"]];
function App(){
  const [toast,setToast]=useState("");
  const aviso=useCallback(m=>{setToast(m);setTimeout(()=>setToast(""),2800);},[]);
  const {S,compras,sync,guardar,guardarCompra,borrarCompra}=useDatos(aviso);
  const [vista,setVista]=useState("inicio");
  const [offW,setOffW]=useState(0);
  const [modal,setModal]=useState(null);
  const K=useCalculos(S,compras,offW);
  if(!S||!K)return <div className="min-h-screen grid place-items-center text-muted text-sm">Cargando…</div>;
  const ctx={S,K,compras,sync,guardar,guardarCompra,borrarCompra,vista,setVista,offW,setOffW,
    modal,abrir:setModal,cerrar:()=>setModal(null),aviso};
  const s=sabado(offW), f=new Date(s); f.setDate(s.getDate()+6);
  const rango=d=>d.toLocaleDateString("es-CO",{day:"numeric",month:"short"});
  const Vista={inicio:Inicio,lista:Lista,menu:Menu,recetas:Recetas,facturas:Facturas,gastos:Gastos}[vista];
  return (<Ctx.Provider value={ctx}>
    <div className="min-h-screen md:flex">
      <aside className="hidden md:flex flex-col w-56 shrink-0 border-r border-line bg-surface px-4 py-5 gap-6 sticky top-0 h-screen">
        <div>
          <div className="serif text-2xl leading-tight">Familia<br/>Sepúlveda</div>
          <div className="text-[11px] uppercase tracking-[.16em] text-muted font-bold mt-1">Mercado y cocina</div>
        </div>
        <nav className="flex flex-col gap-0.5">
          {VISTAS.map(([k,l,ic])=>(
            <button key={k} onClick={()=>setVista(k)}
              className={"flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-semibold text-left "+
                (vista===k?"bg-brandsoft text-brand":"text-muted hover:text-ink hover:bg-sunk")}>
              <Icon n={ic}/>{l}</button>))}
        </nav>
        <div className="mt-auto text-[11px] text-muted flex items-center gap-1.5">
          <span className={"w-1.5 h-1.5 rounded-full "+(sync==="nube"?"bg-good":"bg-gold")}/>
          {sync==="nube"?"Sincronizado":"Guardado en este equipo"}
        </div>
      </aside>

      <div className="flex-1 min-w-0 flex flex-col">
        <header className="sticky top-0 z-20 bg-surface border-b border-line">
          <div className="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
            <div className="md:hidden serif text-lg leading-none">Familia Sepúlveda</div>
            <div className="hidden md:block serif text-xl">{VISTAS.find(v=>v[0]===vista)[1]}</div>
            <div className="flex items-center gap-1">
              <button onClick={()=>setOffW(o=>o-1)} className="text-muted hover:text-ink p-1.5" aria-label="Semana anterior"><Icon n="left" size={17}/></button>
              <button onClick={()=>setOffW(0)} className="mono text-[11px] text-muted hover:text-ink px-1 whitespace-nowrap">
                {offW===0?"esta semana · ":""}{rango(s)}–{rango(f)}</button>
              <button onClick={()=>setOffW(o=>o+1)} className="text-muted hover:text-ink p-1.5" aria-label="Semana siguiente"><Icon n="right" size={17}/></button>
            </div>
          </div>
        </header>
        <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-5 pb-24 md:pb-8"><Vista/></main>
      </div>

      <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-surface border-t border-line grid grid-cols-6 pb-[env(safe-area-inset-bottom)]">
        {VISTAS.map(([k,l,ic])=>(
          <button key={k} onClick={()=>setVista(k)}
            className={"flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold "+(vista===k?"text-brand":"text-muted")}>
            <Icon n={ic} size={19}/>{l}</button>))}
      </nav>
      {toast&&<div className="fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-50 bg-ink text-bg px-4 py-2 rounded-full text-sm font-semibold shadow-lg">{toast}</div>}
      <Modales/>
    </div>
  </Ctx.Provider>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
